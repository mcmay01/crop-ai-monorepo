services:
  postgres:
    image: postgres:17-alpine
    ports: ['5432:5432']
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cropuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-croppass}
      POSTGRES_DB: ${POSTGRES_DB:-cropai}

  redis:
    image: redis:7-alpine
    ports: ['6379:6379']

  ai-service:
    build:
      context: ./apps/ai-service # ⚠️ see note below
      dockerfile: Dockerfile
    ports: ['8000:8000']
    environment:
      - MODEL_PATH=/app/models/crop-disease.onnx

  backend:
    build:
      context: ./apps/backend # ⚠️ see note below
      dockerfile: Dockerfile
    ports: ['3000:3000']
    depends_on: [postgres, redis, ai-service]
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-cropuser}:${POSTGRES_PASSWORD:-croppass}@postgres:5432/${POSTGRES_DB:-cropai}
      - REDIS_URL=redis://redis:6379
      - PYTHON_AI_URL=http://ai-service:8000/predict
      - JWT_SECRET=${JWT_SECRET:-supersecretkey}
